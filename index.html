  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCudK8M09UAQFVWtRZIkGo2un_-hLDGW0o",
      authDomain: "facetten-19.firebaseapp.com",
      databaseURL: "https://facetten-19-default-rtdb.europe-west1.firebasedatabase.app",

      messagingSenderId: "979120531869",
      appId: "1:979120531869:web:911d29ddd82d34bf41a774"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const eventRef = ref(database, "event");

    onValue(eventRef, (snapshot) => {

      const data = snapshot.val();

      if (!data) {
        document.getElementById("status").innerHTML =
          "🟡 Wachten op Anne...";
        return;
      }

      if (data.command === "start") {
        document.getElementById("status").innerHTML =
          "🟢 START! 🎵";
      }

      else if (data.command === "pause") {
        document.getElementById("status").innerHTML =
          "⏸️ Gepauzeerd";
      }

      else {
        document.getElementById("status").innerHTML =
          "🟡 Wachten op Anne...";
      }

    });

  </script>
