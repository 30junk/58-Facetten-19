<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>58 Facetten 19 - Muziektest</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f5f5f5;
    }

    button {
      font-size: 25px;
      padding: 20px 35px;
      margin: 30px 0;
      border: none;
      border-radius: 15px;
      background: #2196f3;
      color: white;
    }

    #status {
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>🎵 58 Facetten 19</h1>

  <button id="meedoen">
    🎵 IK DOE MEE
  </button>

  <div id="status">
    Klaar om te testen
  </div>

  <audio
    id="muziek"
    src="Muziek.mp3"
    controls
    preload="auto">
  </audio>

  <script>

    const knop = document.getElementById("meedoen");
    const muziek = document.getElementById("muziek");
    const status = document.getElementById("status");

    knop.addEventListener("click", async function () {

      try {

        await muziek.play();

        status.innerHTML =
          "🟢 Muziek gestart!";

      } catch (error) {

        console.error(error);

        status.innerHTML =
          "🔴 Muziek kan niet starten.";

      }

    });

  </script>

</body>
</html>
